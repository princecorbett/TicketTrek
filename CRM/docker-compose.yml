version: "3.8"  # Updated to a more recent version
services:
  app:
    build: .
    volumes:
      - .:/CRM
    ports:
      - "8000:8000"
    image: application:CRM  # Corrected image name based on previous content
    container_name: app_container
    command: gunicorn CRM.wsgi:application --bind 0.0.0.0:8000
    depends_on:
      - db
    environment:
      - DB_NAME=your_db_name
      - DB_USER=your_db_user
      - DB_PASSWORD=your_db_password
      - DB_HOST=db
      - DB_PORT=5432

  db:
    image: postgres:15 # Using a specific version of postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data/
    environment:
      - POSTGRES_DB=your_db_name
      - POSTGRES_USER=your_db_user
      - POSTGRES_PASSWORD=your_db_password
    ports: # Optional: expose postgres port to host for debugging/external access
      - "5432:5432"
    container_name: postgres_db_container

volumes:
  postgres_data:
